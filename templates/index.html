<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="card">
        <h1>Iris Deploy</h1>

        <p class="desc">
            just learning docker and flask from this small project.
        </p>

        <div class="row">
            <label>Sepal Length</label>
            <input type="number" id="sepal_length" step="0.1">
        </div>

        <div class="row">
            <label>Sepal Width</label>
            <input type="number" id="sepal_width" step="0.1">
        </div>

        <div class="row">
            <label>Petal Length</label>
            <input type="number" id="petal_length" step="0.1">
        </div>

        <div class="row">
            <label>Petal Width</label>
            <input type="number" id="petal_width" step="0.1">
        </div>

        <button id="predict-btn">
            Predict
        </button>

        <div id="result">
            Waiting for input...
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
